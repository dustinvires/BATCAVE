        cards:
          - type: markdown
            content: |
              # 🦇 BATCAVE Operations Center

              ## Home Status

              **Mission**
              Design • Build • Monitor • Improve • Document

              **Current Project**
              BAT-003 — Network Architecture

              **Operating Principle**
              Safe • Reliable • Comfortable • Efficient • Maintainable • Understandable

              > "If it isn't documented, it doesn't exist."

