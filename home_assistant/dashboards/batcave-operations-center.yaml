          - type: markdown
            content: |
              ## Water Protection Roadmap

              Future entities belong here when installed:

              - Sump float switch
              - Wired leak probe
              - Crawl-space SHT40 temperature/humidity
              - Main water shutoff actuator
              - Outdoor hose valve actuators
              - Crawl-space camera
              - Vacation-mode leak shutoff logic

              Direct water controls are intentionally not exposed in this v1 dashboard.

